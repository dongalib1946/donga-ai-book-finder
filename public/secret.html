<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secret Shelf | Dong-A Library AI Book Finder</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260826-secret-linefix2">
  <style>
    body{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(24,183,200,.18), transparent 30%),
        radial-gradient(circle at 80% 26%, rgba(242,180,38,.18), transparent 28%),
        linear-gradient(135deg, #f6fbff, #fffaf0);
    }
    .secret-shelf{
      box-sizing:border-box;
      width:min(720px, 100%);
      display:grid;
      justify-items:center;
      gap:18px;
      text-align:center;
      padding:clamp(32px, 7vw, 64px);
      border:1px solid rgba(15,53,86,.12);
      border-radius:28px;
      background:rgba(255,255,255,.82);
      box-shadow:0 24px 70px rgba(15,53,86,.14);
      backdrop-filter:blur(18px);
    }
    .secret-shelf img{
      width:118px;
      height:118px;
      object-fit:contain;
      filter:drop-shadow(0 18px 30px rgba(15,53,86,.18));
    }
    .secret-kicker{
      margin:0;
      color:#087447;
      font-weight:900;
      letter-spacing:0;
    }
    .secret-shelf h1{
      margin:0;
      color:#0f3556;
      font-size:clamp(24px, 4.2vw, 54px);
      line-height:1.04;
      letter-spacing:0;
      word-break:keep-all;
    }
    .secret-title-line{
      display:block;
      white-space:nowrap;
    }
    .secret-shelf p{
      margin:0;
      color:#52657a;
      font-size:clamp(16px, 2.3vw, 20px);
      line-height:1.7;
      word-break:keep-all;
    }
    .secret-actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
      margin-top:8px;
    }
    .secret-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:46px;
      padding:12px 18px;
      border-radius:999px;
      text-decoration:none;
      color:#fff;
      background:#0f5579;
      font-weight:900;
      box-shadow:0 10px 24px rgba(15,85,121,.18);
    }
    .secret-link.secondary{
      color:#0f3556;
      background:#fff;
      border:1px solid rgba(15,53,86,.12);
    }
    @media (max-width:520px){
      body{padding:18px}
      .secret-shelf{padding:30px 22px}
    }
  </style>
</head>
<body>
  <main class="secret-shelf">
    <img src="img/ai.png" alt="">
    <p class="secret-kicker">SECRET SHELF</p>
    <h1><span class="secret-title-line">말랑이의 서가에 오신 걸</span><span class="secret-title-line">환영합니다.</span></h1>
    <p>당신만을 위한 책을 소개합니다.</p>
    <div class="secret-actions">
      <a class="secret-link" href="./">AI 추천도서로 돌아가기</a>
      <a class="secret-link secondary" href="https://library.donga.ac.kr/resource/library-catalog/?app=mirtech&amp;mod=detail&amp;record_id=942013&amp;beforelink=%2Fresource%2Fall%2F%3Fquery%3D%25EB%2598%2590%25EB%25A6%25AC%25EC%259D%2598%2B%25EA%25BF%2588" target="_blank" rel="noopener noreferrer">히든도서 보기</a>
    </div>
  </main>
</body>
</html>
