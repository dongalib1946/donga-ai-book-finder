<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>북스타그램 둘러보기 | 동아대학교 도서관</title>
  <style>
    :root{
      color-scheme:light;
      --ink:#172033;
      --muted:#667085;
      --line:#e6e9ef;
      --paper:#fff;
      --bg:#f7f8fb;
      --ig-blue:#405de6;
      --ig-purple:#833ab4;
      --ig-pink:#c13584;
      --ig-red:#fd1d1d;
      --ig-orange:#fcae45;
      --brand:#0f5579;
    }
    *{box-sizing:border-box}
    html,body{margin:0; min-height:100%; background:transparent}
    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      line-height:1.42;
    }
    .embed-shell{
      width:min(1120px,100%);
      margin:0 auto;
      padding:8px;
      background:var(--bg);
    }
    .instagram-frame{
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--paper);
      box-shadow:0 10px 28px rgba(23,32,51,.12);
    }
    .topbar{
      min-height:44px;
      display:grid;
      grid-template-columns:auto minmax(0,1fr) auto;
      align-items:center;
      gap:14px;
      padding:7px clamp(12px,2.4vw,22px);
      border-bottom:1px solid var(--line);
      background:#fff;
    }
    .brand{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-width:0;
      font-weight:950;
      color:#1d2939;
      text-decoration:none;
    }
    .brand img{
      width:26px;
      height:26px;
      border-radius:8px;
      display:block;
    }
    .brand span{
      font-size:18px;
      letter-spacing:0;
    }
    .search-visual{
      justify-self:center;
      width:min(270px,100%);
      min-height:30px;
      display:flex;
      align-items:center;
      gap:9px;
      padding:0 13px;
      border-radius:8px;
      background:#f0f2f5;
      color:#98a2b3;
      font-size:13px;
      font-weight:750;
    }
    .open-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-height:30px;
      padding:3px 10px 3px 4px;
      border:1px solid rgba(193,53,132,.24);
      border-radius:999px;
      background:#fff;
      text-decoration:none;
      font-size:13px;
      font-weight:950;
      white-space:nowrap;
      box-shadow:0 8px 18px rgba(193,53,132,.10);
    }
    .open-link img{
      width:23px;
      height:23px;
      border-radius:7px;
    }
    .open-link span{
      background:linear-gradient(135deg,var(--ig-blue),var(--ig-pink) 48%,var(--ig-red) 72%,var(--ig-orange));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }
    .profile{
      display:grid;
      grid-template-columns:124px minmax(0,1fr);
      gap:32px;
      padding:clamp(14px,2.2vw,24px) clamp(18px,5vw,58px) 14px;
      align-items:center;
    }
    .profile-photo-wrap{
      width:116px;
      aspect-ratio:1;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:linear-gradient(135deg,var(--ig-blue),var(--ig-purple),var(--ig-pink),var(--ig-orange));
      padding:4px;
      text-decoration:none;
    }
    .profile-photo{
      width:100%;
      height:100%;
      border:4px solid #fff;
      border-radius:50%;
      object-fit:cover;
      background:#f2f4f7;
    }
    .profile-main{min-width:0}
    .profile-row{
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    .profile-name{
      margin:0;
      font-size:clamp(22px,3vw,30px);
      font-weight:780;
      line-height:1.15;
      letter-spacing:0;
    }
    .verified{
      width:20px;
      height:20px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:#1d9bf0;
      color:#fff;
      font-size:13px;
      font-weight:950;
    }
    .profile-stats{
      display:flex;
      gap:clamp(16px,4vw,36px);
      flex-wrap:wrap;
      margin:0 0 10px;
      padding:0;
      list-style:none;
    }
    .profile-stats b{font-weight:950}
    .profile-stats span{color:var(--muted); margin-left:4px}
    .bio{
      margin:0;
      color:#1d2939;
      font-weight:760;
    }
    .bio strong{display:block; font-weight:950}
    .tabs{
      display:flex;
      justify-content:center;
      gap:36px;
      border-top:1px solid var(--line);
      margin:0 clamp(18px,5vw,58px);
    }
    .tab{
      min-height:36px;
      display:inline-flex;
      align-items:center;
      gap:7px;
      border-top:2px solid #1d2939;
      color:#1d2939;
      font-size:12px;
      font-weight:950;
      letter-spacing:.04em;
    }
    .feed{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;
      padding:10px clamp(16px,4vw,48px) 12px;
    }
    .post{
      position:relative;
      min-width:0;
      display:block;
      aspect-ratio:1;
      overflow:hidden;
      border-radius:4px;
      background:#eef2f6;
      color:#fff;
      text-decoration:none;
    }
    .post::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:1;
      background:linear-gradient(180deg, transparent 46%, rgba(0,0,0,.64));
      opacity:.92;
      pointer-events:none;
    }
    .post img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      transition:transform .28s ease;
    }
    .post:hover img{transform:scale(1.035)}
    .type-badge{
      position:absolute;
      z-index:2;
      top:8px;
      right:8px;
      min-height:23px;
      display:inline-flex;
      align-items:center;
      padding:0 8px;
      border-radius:999px;
      background:rgba(255,255,255,.92);
      color:#344054;
      font-size:11px;
      font-weight:950;
    }
    .post-caption{
      position:absolute;
      z-index:2;
      left:10px;
      right:10px;
      bottom:10px;
      display:grid;
      gap:5px;
    }
    .post-caption strong{
      overflow:hidden;
      text-overflow:ellipsis;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      font-size:13px;
      line-height:1.3;
      font-weight:900;
    }
    .post-caption small{
      color:rgba(255,255,255,.84);
      font-size:11px;
      font-weight:850;
    }
    .empty{
      grid-column:1/-1;
      min-height:220px;
      display:grid;
      place-items:center;
      padding:24px;
      border:1px dashed var(--line);
      border-radius:8px;
      color:var(--muted);
      font-weight:850;
      text-align:center;
      background:#fff;
    }
    .pager{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:0 18px 16px;
    }
    .pager button{
      min-width:84px;
      min-height:34px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      color:#344054;
      font-weight:950;
      cursor:pointer;
    }
    .pager button:not(:disabled):hover{
      border-color:rgba(193,53,132,.38);
      color:#c13584;
    }
    .pager button:disabled{
      opacity:.42;
      cursor:not-allowed;
    }
    .page-now{
      min-width:90px;
      min-height:34px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      background:linear-gradient(135deg, rgba(64,93,230,.10), rgba(193,53,132,.10), rgba(252,175,69,.12));
      color:#7a2d70;
      font-size:13px;
      font-weight:950;
    }
    .loading .feed{opacity:.52}
    @media (max-width:760px){
      .embed-shell{padding:0}
      .instagram-frame{border-radius:0; box-shadow:none}
      .topbar{grid-template-columns:auto auto; justify-content:space-between}
      .search-visual{display:none}
      .profile{
        grid-template-columns:72px minmax(0,1fr);
        gap:14px;
        padding:14px 12px;
      }
      .profile-photo-wrap{width:72px}
      .profile-photo{border-width:3px}
      .profile-stats{gap:10px; font-size:13px; margin-bottom:6px}
      .bio{font-size:13px}
      .tabs{margin:0 12px}
      .tab{min-height:32px}
      .feed{grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; padding:10px 12px 12px}
      .pager{padding-bottom:12px}
    }
    @media (max-width:460px){
      .open-link span{display:none}
      .brand span{font-size:18px}
      .profile{align-items:start}
      .profile-row{margin-bottom:6px}
      .profile-stats li{width:100%}
      .feed{grid-template-columns:1fr}
      .post{aspect-ratio:4/3}
    }
  </style>
</head>
<body>
  <main class="embed-shell">
    <section class="instagram-frame" id="embedFrame">
      <header class="topbar">
        <a class="brand" href="https://www.instagram.com/dongalibrary/" target="_blank" rel="noopener noreferrer">
          <img src="img/instagram.png" alt="">
          <span>Instagram</span>
        </a>
        <div class="search-visual" aria-hidden="true">⌕ Search</div>
        <a class="open-link" href="https://www.instagram.com/dongalibrary/" target="_blank" rel="noopener noreferrer">
          <img src="img/instagram.png" alt="">
          <span>인스타그램 바로가기</span>
        </a>
      </header>

      <section class="profile" aria-labelledby="profileName">
        <a class="profile-photo-wrap" href="https://www.instagram.com/dongalibrary/" target="_blank" rel="noopener noreferrer" aria-label="동아대학교 도서관 Instagram으로 이동">
          <img class="profile-photo" id="profilePhoto" src="img/instagram.png" alt="">
        </a>
        <div class="profile-main">
          <div class="profile-row">
            <h1 class="profile-name" id="profileName">dongalibrary</h1>
            <span class="verified" aria-label="verified">✓</span>
          </div>
          <ul class="profile-stats" aria-label="Instagram profile stats">
            <li><b id="postCount">-</b><span>posts</span></li>
            <li><b id="followerCount">-</b><span>followers</span></li>
            <li><b id="followingCount">-</b><span>following</span></li>
          </ul>
          <p class="bio">
            <strong>동아대학교 도서관</strong>
            책과 사람, 도서관의 순간을 전합니다.
          </p>
        </div>
      </section>

      <nav class="tabs" aria-label="Instagram feed tabs">
        <span class="tab">▦ POSTS</span>
      </nav>

      <section class="feed" id="feed" aria-live="polite">
        <div class="empty">Instagram 피드를 불러오는 중입니다.</div>
      </section>

      <nav class="pager" aria-label="Instagram page navigation">
        <button type="button" id="prevPage" disabled>이전</button>
        <span class="page-now" id="pageNow">1</span>
        <button type="button" id="nextPage" disabled>다음</button>
      </nav>
    </section>
  </main>

  <script>
    (() => {
      const LIMIT = 4;
      const BATCH_LIMIT = 60;
      const frame = document.getElementById('embedFrame');
      const feed = document.getElementById('feed');
      const prevButton = document.getElementById('prevPage');
      const nextButton = document.getElementById('nextPage');
      const pageNow = document.getElementById('pageNow');
      const profileName = document.getElementById('profileName');
      const profilePhoto = document.getElementById('profilePhoto');
      const postCount = document.getElementById('postCount');
      const followerCount = document.getElementById('followerCount');
      const followingCount = document.getElementById('followingCount');
      let allItems = [];
      let pageIndex = 0;
      let loading = false;

      function formatNumber(value){
        const number = Number(value);
        if(!Number.isFinite(number)) return '-';
        return new Intl.NumberFormat('ko-KR', { notation:number >= 10000 ? 'compact' : 'standard' }).format(number);
      }

      function formatDate(value){
        const date = new Date(value);
        if(Number.isNaN(date.getTime())) return '';
        return new Intl.DateTimeFormat('ko-KR', {
          timeZone:'Asia/Seoul',
          year:'numeric',
          month:'2-digit',
          day:'2-digit'
        }).format(date);
      }

      function typeLabel(value){
        if(value === 'VIDEO') return 'VIDEO';
        if(value === 'REELS') return 'REELS';
        if(value === 'CAROUSEL_ALBUM') return 'ALBUM';
        return 'POST';
      }

      function setEmpty(message){
        feed.innerHTML = '';
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = message;
        feed.appendChild(empty);
      }

      function renderProfile(profile){
        if(!profile) return;
        profileName.textContent = profile.username || 'dongalibrary';
        if(profile.profilePictureUrl) profilePhoto.src = profile.profilePictureUrl;
        postCount.textContent = formatNumber(profile.mediaCount);
        followerCount.textContent = formatNumber(profile.followersCount);
        followingCount.textContent = formatNumber(profile.followsCount);
      }

      function renderPosts(items){
        feed.innerHTML = '';
        if(!items.length){
          setEmpty('표시할 Instagram 게시물이 없습니다.');
          return;
        }
        items.forEach((post) => {
          const link = document.createElement('a');
          link.className = 'post';
          link.href = post.permalink || 'https://www.instagram.com/dongalibrary/';
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          const imageUrl = post.thumbnailUrl || post.mediaUrl || '';
          link.innerHTML = `
            <img alt="" loading="lazy">
            <span class="type-badge"></span>
            <span class="post-caption">
              <strong></strong>
              <small></small>
            </span>
          `;
          const image = link.querySelector('img');
          if(imageUrl){
            image.src = imageUrl;
          }else{
            image.remove();
          }
          link.querySelector('.type-badge').textContent = typeLabel(post.mediaType);
          link.querySelector('strong').textContent = post.caption || '@dongalibrary 게시물';
          link.querySelector('small').textContent = formatDate(post.timestamp);
          feed.appendChild(link);
        });
      }

      function updatePager(){
        const maxPage = Math.max(1, Math.ceil(allItems.length / LIMIT));
        pageNow.textContent = `${pageIndex + 1} / ${maxPage}`;
        prevButton.disabled = loading || pageIndex === 0;
        nextButton.disabled = loading || pageIndex >= maxPage - 1;
      }

      function renderPage(targetIndex){
        pageIndex = Math.max(0, Math.min(targetIndex, Math.max(0, Math.ceil(allItems.length / LIMIT) - 1)));
        const start = pageIndex * LIMIT;
        renderPosts(allItems.slice(start, start + LIMIT));
        updatePager();
      }

      async function loadFeed(){
        if(loading) return;
        loading = true;
        frame.classList.add('loading');
        prevButton.disabled = true;
        nextButton.disabled = true;
        try{
          const url = new URL('/.netlify/functions/instagram-feed', window.location.origin);
          url.searchParams.set('limit', String(BATCH_LIMIT));
          url.searchParams.set('mode', 'batch');
          const response = await fetch(url, { headers:{ accept:'application/json' } });
          const data = await response.json().catch(() => ({}));
          if(!response.ok) throw new Error(data.error || 'Instagram 피드를 불러오지 못했습니다.');
          renderProfile(data.profile);
          allItems = Array.isArray(data.items) ? data.items : [];
          renderPage(0);
        }catch(error){
          console.warn(error);
          setEmpty(error.message || 'Instagram 피드를 불러오지 못했습니다.');
          allItems = [];
          updatePager();
        }finally{
          loading = false;
          frame.classList.remove('loading');
          updatePager();
        }
      }

      prevButton.addEventListener('click', () => {
        if(pageIndex <= 0) return;
        renderPage(pageIndex - 1);
      });

      nextButton.addEventListener('click', () => {
        renderPage(pageIndex + 1);
      });

      loadFeed();
    })();
  </script>
</body>
</html>
