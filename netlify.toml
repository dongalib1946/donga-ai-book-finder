functionsDirectory = "netlify/functions"
functionsDirectoryOrigin = "config-v1"
headersOrigin = "config"
plugins = []
redirects = []

[build]
publish = "public"
publishOrigin = "config"
functions = "netlify/functions"

  [build.environment]
    SECRETS_SCAN_OMIT_KEYS = "SMTP_HOST"
    SECRETS_SCAN_OMIT_PATHS = "node_modules/**"

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[functions]

  [functions."*"]

  [functions."recommend-books"]
  included_files = ["netlify/data/library-pool.json", "netlify/data/library-catalog-pool.json"]

  [functions."questions"]
  included_files = ["netlify/data/questions.json"]

[[edge_functions]]
path = "/*"
function = "traffic-guard"

  [edge_functions.header]
  netlify-agent-category = "^(ai-agent|crawler|tooling|none)(;.*)?$"

[[edge_functions]]
path = "/img/*"
function = "hotlink-guard"

  [edge_functions.header]
  sec-fetch-site = "cross-site"

[[edge_functions]]
path = "/*.js"
function = "hotlink-guard"

  [edge_functions.header]
  sec-fetch-site = "cross-site"

[[edge_functions]]
path = "/*.css"
function = "hotlink-guard"

  [edge_functions.header]
  sec-fetch-site = "cross-site"

[[edge_functions]]
path = "/.netlify/functions/*"
function = "hotlink-guard"

  [edge_functions.header]
  sec-fetch-site = "cross-site"

[[headers]]
for = "/*"

  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
for = "/img/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.js"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.css"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.html"

  [headers.values]
  Cache-Control = "public, max-age=300, stale-while-revalidate=3600"
