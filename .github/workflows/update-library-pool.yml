name: Update library book pool snapshot

on:
  schedule:
    - cron: '20 3 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: library-pool-snapshot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      POOL_SNAPSHOT_PAGE_LIMIT: '50'
      POOL_SNAPSHOT_DELAY_MS: '800'
      POOL_SNAPSHOT_FETCH_TIMEOUT_MS: '15000'
      POOL_SNAPSHOT_FETCH_RETRIES: '2'
      POOL_SNAPSHOT_RETRY_DELAY_MS: '1500'
      POOL_SNAPSHOT_STALE_PAGE_LIMIT: '2'
      ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update snapshot
        run: node scripts/update-library-pool-snapshot.js

      - name: Update Aladin bestsellers
        run: node scripts/update-aladin-bestsellers.js

      - name: Sync public data
        run: |
          mkdir -p public/data
          cp netlify/data/questions.json public/data/questions.json
          cp netlify/data/library-pool.json public/data/library-pool.json
          cp netlify/data/library-catalog-pool.json public/data/library-catalog-pool.json
          cp netlify/data/aladin-bestsellers.json public/data/aladin-bestsellers.json

      - name: Commit snapshot
        run: |
          if git diff --quiet -- netlify/data/library-pool.json netlify/data/aladin-bestsellers.json public/data/questions.json public/data/library-pool.json public/data/library-catalog-pool.json public/data/aladin-bestsellers.json; then
            echo "No library pool changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/data/library-pool.json netlify/data/aladin-bestsellers.json public/data/questions.json public/data/library-pool.json public/data/library-catalog-pool.json public/data/aladin-bestsellers.json
          git commit -m "Update library book pool snapshot"
          git push
