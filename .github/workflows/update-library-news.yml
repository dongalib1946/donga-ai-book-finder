name: Update library news snapshot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: library-news-snapshot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update snapshot
        run: node scripts/update-library-news-snapshot.js

      - name: Commit snapshot
        run: |
          if git diff --quiet -- netlify/data/library-news-snapshot.json; then
            echo "No library news changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/data/library-news-snapshot.json
          git commit -m "Update library news snapshot"
          git push
